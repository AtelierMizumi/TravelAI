name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    name: Governance (TAGF checkpoints)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run governance checkpoints
        run: bash scripts/governance-check.sh origin/main
      - name: Test governance harness
        run: bash scripts/test-governance-check.sh

  backend:
    name: Core Backend (Spring Boot tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: ./mvnw -q test

  ai-service:
    name: AI Service (FastAPI tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: uv run --extra dev pytest -q
        env:
          VISION_MOCK_ENABLED: 'true'

  client:
    name: Frontend (React build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, ai-service, client]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build AI service image
        uses: docker/build-push-action@v6
        with:
          context: services/ai
          push: false
          tags: travelai-ai-service:ci
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: services/core
          push: false
          tags: travelai-backend:ci
      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: client
          push: false
          tags: travelai-client:ci
      - name: Validate compose file
        run: POSTGRES_PASSWORD=ci-placeholder JWT_SECRET=ci-placeholder docker compose config -q

      - name: Compose requires JWT_SECRET
        run: bash scripts/test-compose-secrets.sh
