name: CI

on:
  push:
    branches: [main, "integration/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Governance checkpoints (when the script is present)
        run: |
          if [ -f scripts/governance-check.sh ]; then
            bash scripts/governance-check.sh origin/main
          else
            echo "scripts/governance-check.sh not on this branch yet: skipped"
          fi

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-scan-secrets.sh
      - run: bash scripts/scan-secrets.sh

  backend:
    name: Backend (Spring Boot, Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travelai_test
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: travelai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travelai_test -d travelai_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      TRAVELAI_TEST_DB_URL: jdbc:postgresql://localhost:5432/travelai_test
      TRAVELAI_TEST_DB_USER: travelai_test
      TRAVELAI_TEST_DB_PASSWORD: ci-synthetic-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B test

  mobile:
    name: App (Expo lint, tests, types, web export)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - name: Export web bundle
        env:
          EXPO_PUBLIC_API_URL: https://ci.example.test/api
          EXPO_PUBLIC_AI_API_URL: https://ci.example.test/ai
        run: npx expo export -p web --output-dir dist

  ai:
    name: AI service (FastAPI, mocked provider)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      # The contract tests patch the Google Vision client: no provider call, no credentials.
      - run: python -m unittest discover -s tests -v

  scripts:
    name: Deploy scripts and seed loader tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-edge-config.sh
      - run: bash scripts/test-gen-secrets.sh
      - run: bash scripts/test-deploy-agent.sh
      - run: python3 -I scripts/seed/test_dataset.py
      - run: python3 -I scripts/seed/test_seed_demo.py

  compose-smoke:
    name: Compose stack, seed and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, mobile, ai, scripts]
    env:
      COMPOSE_PROJECT_NAME: travelai-prod
      COMPOSE: >-
        docker compose --profile v2
        -f docker-compose.yml -f docker-compose.edge.yml -f docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Build web bundle for the local origin
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8088/api
          EXPO_PUBLIC_AI_API_URL: http://127.0.0.1:8088/ai
        run: |
          npm ci
          npx expo export -p web --output-dir dist
      - name: Generate throwaway secrets
        run: |
          bash scripts/gen-secrets.sh >/dev/null
          echo '{}' > "$RUNNER_TEMP/gcp.json"
          {
            echo "PUBLIC_ORIGIN=http://127.0.0.1:8088"
            echo "HOST_GCP_KEY=$RUNNER_TEMP/gcp.json"
            echo "CLOUDFLARE_TUNNEL_TOKEN=ci-not-used"
            echo "HOST_UID=$(id -u)"
            echo "HOST_GID=$(id -g)"
          } >> .env
      - name: Start the stack (no tunnel)
        run: |
          set -a; . ./.env; set +a
          $COMPOSE up -d --build --wait postgres-v2 ai-v2 backend-v2 caddy
      - name: Smoke test on an empty database
        run: SEEDED=0 bash scripts/smoke-edge.sh http://127.0.0.1:8088
      - name: Seed demo data, twice (second run must change nothing)
        run: |
          bash scripts/seed.sh
          bash scripts/seed.sh | tee second.log
          grep -q "created=0" second.log
      - name: Smoke test with demo data
        run: SEEDED=1 bash scripts/smoke-edge.sh http://127.0.0.1:8088
      - name: Logs on failure
        if: failure()
        run: |
          set -a; . ./.env; set +a
          $COMPOSE logs --no-color --tail=120
      - name: Tear down
        if: always()
        run: |
          set -a; . ./.env; set +a
          $COMPOSE down -v --remove-orphans

  publish:
    name: Publish images (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [governance, secret-scan, backend, mobile, ai, scripts, compose-smoke]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN || 'https://travelai.minhthuan.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tag
        id: tag
        run: echo "value=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/ateliermizumi/travelai-backend:${{ steps.tag.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: AI image
        uses: docker/build-push-action@v6
        with:
          context: ai-service
          push: true
          tags: ghcr.io/ateliermizumi/travelai-ai:${{ steps.tag.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,scope=ai,mode=max
      - name: Web image (bundle baked for the public origin)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          build-args: PUBLIC_ORIGIN=${{ env.PUBLIC_ORIGIN }}
          push: true
          tags: ghcr.io/ateliermizumi/travelai-web:${{ steps.tag.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
