spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/travel_ai
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Browser origins allowed for REST CORS and WebSocket handshakes (comma separated, no wildcards).
travelai.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:8084,http://127.0.0.1:8084,http://localhost:19006}
# Production sets TRAVELAI_MESSAGE_KEY_REQUIRED=true so the app refuses to start without a key.
travelai.message-key-required=${TRAVELAI_MESSAGE_KEY_REQUIRED:false}
