services:
  # ============================================================================
  # TravelAI stack: Expo app backend, AI service, database.
  # Start with: docker compose up -d --build postgres-v2 ai-v2 backend-v2
  # (the "-v2" suffix is the product generation, TravelAI 2.0; names are kept so
  # the production deploy agent and its volumes keep working.)
  # Needs POSTGRES_PASSWORD, plus HOST_GCP_KEY (service-account JSON path on the
  # host) and HOST_MESSAGE_KEY (message key file path); both must be set (the service fails to start if a path is missing).
  # ============================================================================
  postgres-v2:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel_ai
      POSTGRES_USER: travelai_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in env or .env (see .env.example)}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelai_user -d travel_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travelai-network

  ai-v2:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    restart: unless-stopped
    # Run as the host user (non-root) so 0600 secret files mounted read-only stay readable.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gcp.json
      - AI_ALLOWED_ORIGINS=${AI_ALLOWED_ORIGINS:-http://localhost:8084,http://127.0.0.1:8084,http://localhost:8081,http://127.0.0.1:8081}
    volumes:
      - type: bind
        source: ${HOST_GCP_KEY:-/nonexistent/HOST_GCP_KEY-is-unset}
        target: /run/secrets/gcp.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${V2_BIND_ADDR:-127.0.0.1}:8000:8000"
    networks:
      - travelai-network

  backend-v2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # Run as the host user (non-root) so 0600 secret files mounted read-only stay readable.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      postgres-v2:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-v2:5432/travel_ai
      - SPRING_DATASOURCE_USERNAME=travelai_user
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in env or .env (see .env.example)}
      - TRAVELAI_MESSAGE_KEY_FILE=/run/secrets/message.key
      - SPRING_JPA_SHOW_SQL=false
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # Password-reset mail over SMTP (defaults target Resend). Leave the password empty to disable it.
      - TRAVELAI_SMTP_HOST=${TRAVELAI_SMTP_HOST:-smtp.resend.com}
      - TRAVELAI_SMTP_PORT=${TRAVELAI_SMTP_PORT:-587}
      - TRAVELAI_SMTP_USERNAME=${TRAVELAI_SMTP_USERNAME:-resend}
      - TRAVELAI_SMTP_PASSWORD=${TRAVELAI_SMTP_PASSWORD:-}
      - TRAVELAI_SMTP_FROM=${TRAVELAI_SMTP_FROM:-}
      - TRAVELAI_RESET_SECRET=${TRAVELAI_RESET_SECRET:-}
    volumes:
      - type: bind
        source: ${HOST_MESSAGE_KEY:-/nonexistent/HOST_MESSAGE_KEY-is-unset}
        target: /run/secrets/message.key
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${V2_BIND_ADDR:-127.0.0.1}:8080:8080"
    networks:
      - travelai-network

volumes:
  postgres_v2_data:
    driver: local

networks:
  travelai-network:
    driver: bridge
