services:
  # ============================================================================
  # Relational Database: PostgreSQL 16
  # Schema and seed data are applied on the first start of an empty volume.
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: travelai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: travelai_db
      POSTGRES_USER: travelai_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in env or .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/core/src/main/resources/db/init_schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelai_user -d travelai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travelai-network

  # ============================================================================
  # AI Microservice: Python FastAPI + Google Cloud Vision SDK
  # Runs in deterministic mock mode unless VISION_MOCK_ENABLED=false and
  # Google credentials are provided.
  # ============================================================================
  ai-service:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: travelai-ai-service
    restart: unless-stopped
    environment:
      - PORT=8000
      - VISION_MOCK_ENABLED=${VISION_MOCK_ENABLED:-true}
    ports:
      - "8000:8000"
    networks:
      - travelai-network

  # ============================================================================
  # Core Business Backend: Java 17 + Spring Boot 3
  # ============================================================================
  backend:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    container_name: travelai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/travelai_db
      - SPRING_DATASOURCE_USERNAME=travelai_user
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in env or .env (see .env.example)}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - AI_SERVICE_URL=http://ai-service:8000
    ports:
      - "8080:8080"
    networks:
      - travelai-network

  # ============================================================================
  # Presentation Layer: React 18 + Vite SPA served by NGINX
  # The browser talks to a single origin; NGINX proxies /api/v1/vision/ to the
  # AI service and /api/ to the core backend (see client/nginx.conf).
  # ============================================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: travelai-client
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - travelai-network

volumes:
  postgres_data:
    driver: local

networks:
  travelai-network:
    driver: bridge
